name: Inventory offline smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - inventory.py
      - requirements.txt
      - tests/**
      - .github/workflows/python-tests.yml

permissions:
  contents: read

jobs:
  headless-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system barcode dependency
        run: sudo apt-get update -qq && sudo apt-get install -y libzbar0
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q inventory.py tests
      - name: Offline import and temporary database smoke test
        run: python -m unittest discover -s tests -p 'test_*.py' -v
